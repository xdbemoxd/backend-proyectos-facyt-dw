# ============================================================================
# docker-compose.yml — despliegue local reproducible
#
#   PostgreSQL 16 + backend FastAPI + frontend Next.js
#
# Uso:
#   cp .env.example .env        (y completar valores locales)
#   docker compose up --build
#
# Seguridad:
#   * Los secretos NO tienen valores por defecto: compose falla si faltan en
#     el .env (${VAR:?mensaje}). No hay placeholders reutilizables.
#   * PostgreSQL y el backend no publican puertos al host: solo se alcanzan
#     dentro de la red de compose. El navegador usa el frontend (3000), que
#     reenvia las llamadas al backend por la red interna (BFF).
#
# El frontend se construye desde el repositorio hermano:
#   ../frontend-proyectos-facyt
# Si este compose se mueve de carpeta, ajusta `frontend.build.context`.
# ============================================================================

name: proyectos-facyt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proyectos_facyt}
      POSTGRES_USER: ${POSTGRES_USER:-proyectos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (sin valores por defecto)}
    # Sin `ports`: la base solo es accesible desde la red interna de compose.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-proyectos} -d ${POSTGRES_DB:-proyectos_facyt}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica db/schema/*.sql y (opcionalmente) db/seeds/*.sql cuando la base esta
  # sana. Es idempotente: se puede volver a ejecutar en cada `compose up`.
  # SEED_DEMO_DATA=false salta los seeders (recomendado fuera de demo local).
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-proyectos_facyt}
      PGUSER: ${POSTGRES_USER:-proyectos}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGCLIENTENCODING: UTF8
      DB_ROOT: /db
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/scripts/init_db.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proyectos}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-proyectos_facyt}
      SCHEMA: private
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env (minimo 32 bytes aleatorios)}
      JWT_ISSUER: ${JWT_ISSUER:-proyectos-facyt-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-proyectos-facyt-frontend}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-dev.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-dev-only}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT: ${RATE_LIMIT:-100/minute}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      TRUST_PROXY_HEADERS: "false"
      AUDIT_HTTP_ALL: "false"
      # La auditoria HTTP nunca bloquea la respuesta: cola acotada + worker.
      AUDIT_SYNC_WRITES: "false"
      AUDIT_QUEUE_MAXSIZE: ${AUDIT_QUEUE_MAXSIZE:-10000}
      AUDIT_WORKER_CONCURRENCY: ${AUDIT_WORKER_CONCURRENCY:-2}
      AUDIT_BATCH_SIZE: ${AUDIT_BATCH_SIZE:-50}
      AUDIT_WRITE_RETRIES: ${AUDIT_WRITE_RETRIES:-2}
      AUDIT_RETRY_BACKOFF_MS: ${AUDIT_RETRY_BACKOFF_MS:-200}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      TOKEN_CRON: ${TOKEN_CRON:-local-dev-only}
    # Sin `ports`: solo el frontend (BFF server-side) habla con el backend.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend-proyectos-facyt
      dockerfile: Dockerfile
      args:
        # Se incrusta en el bundle del navegador: debe fijarse en build time.
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Comunicacion server-side (BFF) dentro de la red de compose.
      BACKEND_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env (minimo 32 bytes aleatorios)}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Define NEXTAUTH_SECRET en .env (igual que AUTH_SECRET)}
      # URL publica que ve el navegador. Si cambias FRONTEND_PORT, ajusta estas.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-dev.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-dev-only}
      NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
    name: proyectos-facyt-pgdata
